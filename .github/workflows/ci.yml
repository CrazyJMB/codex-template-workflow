name: CI

on:
  pull_request:
    branches: [develop, main]
    types: [opened, reopened, synchronize, edited]
  push:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run applicable checks
        run: bash scripts/ci.sh
      - name: Validate release preparation
        if: github.event_name == 'pull_request'
        env:
          PR_HEAD: ${{ github.event.pull_request.head.ref }}
          PR_BASE: ${{ github.event.pull_request.base.ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail
          case "$PR_HEAD" in
            chore/release-v*) python scripts/check-release.py "${PR_HEAD#chore/release-}" ;;
            develop)
              if [[ "$PR_BASE" == main ]]; then
                python scripts/check-release.py "${PR_TITLE#release: }"
              fi
              ;;
            hotfix/*) python scripts/check-release.py --from-changelog ;;
            *) echo 'No release preparation checks apply to this PR.' ;;
          esac
