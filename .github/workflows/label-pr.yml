# Only reads PR metadata; never checks out or executes untrusted PR code.
name: Auto-label PR

on:
  pull_request_target:
    types: [opened, reopened, synchronize, edited]

permissions:
  contents: read
  issues: write

jobs:
  label:
    name: label
    runs-on: ubuntu-latest
    steps:
      - name: Apply type label from branch prefix
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          base=$(jq -r '.pull_request.base.ref' "$GITHUB_EVENT_PATH")
          head=$(jq -r '.pull_request.head.ref' "$GITHUB_EVENT_PATH")
          number=$(jq -r '.pull_request.number' "$GITHUB_EVENT_PATH")
          case "$head" in
            feature/*) category=feature ;;
            fix/*) category=fix ;;
            hotfix/*) category=hotfix ;;
            refactor/*) category=refactor ;;
            docs/*) category=docs ;;
            chore/*) category=chore ;;
            test/*) category=test ;;
            ci/*) category=ci ;;
            perf/*) category=perf ;;
            release/*) category=release ;;
            sync/*) category=sync ;;
            develop) if [[ "$base" == main ]]; then category=release; else exit 0; fi ;;
            main) if [[ "$base" == develop ]]; then category=sync; else exit 0; fi ;;
            *) echo "Unknown branch type: $head"; exit 0 ;;
          esac
          label="type:$category"
          # Remove outdated type labels; keep independent labels such as "breaking".
          while IFS= read -r old_label; do
            if [[ "$old_label" != "$label" ]]; then
              gh api --method DELETE "repos/$GH_REPO/issues/$number/labels/$old_label" >/dev/null
            fi
          done < <(jq -r '.pull_request.labels[].name | select(startswith("type:"))' "$GITHUB_EVENT_PATH")
          # Create the label if it is not present in the repository.
          if ! gh api "repos/$GH_REPO/labels/$label" >/dev/null 2>&1; then
            gh api --method POST "repos/$GH_REPO/labels" \
              -f name="$label" -f color="336699" \
              -f description="Pull request type: $category" >/dev/null
          fi
          gh api --method POST "repos/$GH_REPO/issues/$number/labels" \
            -f "labels[]=$label" >/dev/null
          echo "Applied $label to PR #$number"
