name: PR policy

on:
  pull_request:
    branches: [develop, main]
    types: [opened, reopened, synchronize, edited, labeled, unlabeled, ready_for_review]

permissions:
  contents: read

jobs:
  policy:
    name: policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate branch, title and label
        run: bash scripts/pr-policy.sh "$GITHUB_EVENT_PATH"
