name: Publish release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to recover using reviewed tooling from main'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Validate release request
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || { echo 'Invalid version tag'; exit 1; }
          if [[ "$EVENT_NAME" == workflow_dispatch && "$GITHUB_REF" != refs/heads/main ]]; then
            echo 'Recovery must run from main'; exit 1
          fi
      - name: Check out reviewed release tooling
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && 'main' || github.sha }}
          path: release-tools
          fetch-depth: 0
          persist-credentials: false
      - name: Check out original release source
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          path: release-source
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify release tag and branch
        working-directory: release-source
        run: |
          set -euo pipefail
          [[ "$(git cat-file -t "refs/tags/$RELEASE_TAG")" == tag ]] || { echo 'Release tag must be annotated'; exit 1; }
          git merge-base --is-ancestor HEAD origin/main || { echo 'Tag is not on main'; exit 1; }
      - name: Build release notes and packages
        working-directory: release-source
        run: |
          set -euo pipefail
          python3 ../release-tools/scripts/check-release.py "$RELEASE_TAG"
          python3 ../release-tools/scripts/extract-release-notes.py "$RELEASE_TAG" > "$RUNNER_TEMP/release-notes.md"
          bash ../release-tools/scripts/package-release.sh "$RELEASE_TAG"
      - name: Publish GitHub Release
        working-directory: release-source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash ../release-tools/scripts/publish-release.sh "$RELEASE_TAG" "$RUNNER_TEMP/release-notes.md"
